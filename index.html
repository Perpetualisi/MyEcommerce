<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Viewport for mobile -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/favicon.png" />

    <!-- Title (Google & Browser Tab) -->
    <title>Ecommerce - Shop Stylish & Affordable Products Online</title>

    <!-- ✅ SEO Meta Tags -->
    <meta
      name="description"
      content="Discover stylish and affordable products at Ecommerce. Shop clothing, accessories, and tech gadgets with fast delivery and secure payment."
    />
    <meta
      name="keywords"
      content="Ecommerce, online store, affordable fashion, gadgets, accessories, Nigeria shopping"
    />
    <meta name="author" content="Ecommerce Team" />
    <link rel="canonical" href="https://www.ecommerce.com/" />

    <!-- ✅ Open Graph (Facebook, LinkedIn, WhatsApp) -->
    <meta property="og:title" content="Ecommerce - Shop Stylish & Affordable Products Online" />
    <meta
      property="og:description"
      content="Affordable, stylish, and modern shopping experience. Discover our latest collection today!"
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.ecommerce.com/" />
    <meta property="og:image" content="https://www.ecommerce.com/social-image.png" />

    <!-- ✅ Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Ecommerce - Shop Stylish & Affordable Products Online" />
    <meta
      name="twitter:description"
      content="Discover affordable and stylish products at Ecommerce. Shop now with secure payments!"
    />
    <meta name="twitter:image" content="https://www.ecommerce.com/social-image.png" />

    <!-- 🌍 Geo & Mobile SEO -->
    <meta name="geo.region" content="NG" />
    <meta name="geo.country" content="Nigeria" />
    <meta name="distribution" content="global" />

    <!-- 🎨 Browser Theme -->
    <meta name="theme-color" content="#0a74da" />

    <!-- ✅ Structured Data (Rich Results) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Store",
        "name": "Ecommerce",
        "url": "https://www.ecommerce.com/",
        "logo": "https://www.ecommerce.com/logo.png",
        "sameAs": [
          "https://www.facebook.com/ecommerce",
          "https://www.twitter.com/ecommerce"
        ]
      }
    </script>

    <!-- Google Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap"
      rel="stylesheet"
    />

    <!-- Preload main stylesheet for speed -->
    <link rel="preload" href="/src/styles.css" as="style" />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>

  <body>
    <!-- React App Root -->
    <div id="root"></div>

    <!-- React Main Script -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
