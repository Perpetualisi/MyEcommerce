<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

    <link rel="icon" type="image/png" href="/favicon.png?v=1" />

    <title>Vendo Archive | Curated Modern Essentials</title>

    <meta name="description" content="A curated archive of creativity, technology, and intentional design. Shop Vendo Archive for premium essentials." />
    <meta name="keywords" content="Vendo Archive, minimalist fashion, tech gadgets, intentional design" />
    <meta name="author" content="Vendo Team" />

    <style>
      html, body {
        margin: 0 !important;
        padding: 0 !important;
        width: 100% !important;
        height: 100%;
        /* clip instead of hidden — hidden creates a scroll container
           which kills position:sticky on ALL descendants              */
        overflow-x: clip;
        background-color: #000;
      }
      #root {
        width: 100%;
        margin: 0;
        padding: 0;
        /* Never set overflow here — also kills sticky */
      }
    </style>
  </head>

  <body class="m-0 p-0">
    <div id="root"></div>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
