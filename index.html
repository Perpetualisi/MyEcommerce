<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

    <link rel="icon" type="image/png" href="/favicon.png?v=1" />

    <title>Vendo Archive | Curated Modern Essentials</title>

    <meta name="description" content="A curated archive of creativity, technology, and intentional design. Shop Vendo Archive for premium essentials." />
    <meta name="keywords" content="Vendo Archive, minimalist fashion, tech gadgets, intentional design" />
    <meta name="author" content="Vendo Team" />

    <style>
      /* This is the magic fix for the white edges */
      html, body {
        margin: 0 !important;
        padding: 0 !important;
        width: 100% !important;
        height: 100%;
        overflow-x: hidden; /* Prevents tiny horizontal scrollbars */
        background-color: #0c0a09; /* Forces the background to be stone-950 immediately */
      }
      #root {
        width: 100%;
        margin: 0;
        padding: 0;
      }
    </style>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400&display=swap" rel="stylesheet" />

    <script src="https://cdn.tailwindcss.com"></script>

    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'], // Switched to a cleaner minimalist font
            },
            colors: {
              // Your Archive Colors
              stone: {
                50: '#fafaf9',
                100: '#f5f5f4',
                200: '#e7e5e4',
                400: '#a8a29e',
                500: '#78716c',
                800: '#292524',
                900: '#1c1917',
                950: '#0c0a09',
              }
            }
          }
        }
      }
    </script>
  </head>

  <body class="bg-stone-950 m-0 p-0">
    <div id="root"></div>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
